name: Build NVDA add-on

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install gettext
        shell: pwsh
        run: |
          choco install gettext -y --no-progress
          'C:\Program Files\gettext-iconv\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate, test, and build
        shell: pwsh
        run: .\build.ps1 -OutputPath '.\xmplayAccessibility-1.1.0.nvda-addon'

      - name: Upload NVDA add-on
        uses: actions/upload-artifact@v4
        with:
          name: xmplayAccessibility-1.1.0
          path: .\xmplayAccessibility-1.1.0.nvda-addon
